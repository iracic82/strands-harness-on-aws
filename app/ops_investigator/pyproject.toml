[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ops-investigator"
version = "0.1.0"
description = "AWS Ops Investigator built on the Strands harness for AgentCore Runtime"
requires-python = ">=3.10"
dependencies = [
  "strands-harness==0.1.1",
  "strands-agents[otel]==1.56.0",
  "bedrock-agentcore==1.24.0",
  "a2a-sdk[http-server]>=1.1,<2",
  "aws-opentelemetry-distro~=0.18.0",
  "boto3>=1.43",
  "jmespath>=1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["ops_investigator"]
