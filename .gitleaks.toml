# gitleaks configuration. `make hygiene` runs `gitleaks detect --no-banner --source .` with it, the
# pre-commit hook runs it on staged changes, and the `secrets` CI job runs it on every push.
#
# gitleaks finds credential-shaped strings. It does not know what *this* repo's local state looks
# like -- account ids, runtime ARNs, Cognito pool ids -- so tests/test_repo_hygiene.py covers that
# half. Neither check subsumes the other; `make hygiene` runs both.
title = "strands-harness-on-aws"

[extend]
useDefault = true

[[allowlists]]
description = "Design history, stripped from the published archive by .gitattributes export-ignore."
paths = [
  '''^docs/superpowers/''',
  '''^\.superpowers/''',
]

[[allowlists]]
description = "The documentation placeholder account id, which is not anybody's account."
regexTarget = "match"
regexes = ['''123456789012''']
