name: ci

on: [push, pull_request]

# Minimal token scope: this workflow only reads the repo and builds images locally (no push, no deploy).
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install ${{ matrix.python }}
      - run: uv sync --frozen --python ${{ matrix.python }}
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run pytest

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install "3.12"
      - run: uv sync --frozen --python "3.12"
      # TODO(Task 16): scripts/verify_docs.py does not exist yet. Uncomment once it lands.
      # - run: uv run python scripts/verify_docs.py

  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - run: docker buildx build --platform linux/arm64 -f app/ops_investigator/Dockerfile app/ops_investigator
      - run: docker buildx build --platform linux/arm64 -f app/ops_investigator/Dockerfile.a2a app/ops_investigator
