name: ci

on: [push, pull_request]

# Minimal token scope: this workflow only reads the repo and builds images locally (no push, no deploy).
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install ${{ matrix.python }}
      - run: uv sync --frozen --python ${{ matrix.python }}
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run pytest

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      # mermaid-cli is a node package, and it parses a diagram by rendering it in a headless Chromium
      # that puppeteer downloads on first use. Both caches are keyed on the file that pins the version.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ~/.cache/puppeteer
          key: mermaid-${{ runner.os }}-${{ hashFiles('scripts/verify_docs.py') }}
          restore-keys: mermaid-${{ runner.os }}-
      - run: uv python install "3.12"
      - run: uv sync --frozen --python "3.12"
      # Every relative link, image, and heading anchor in the repo's markdown has to resolve.
      - run: uv run python scripts/check_links.py
      # Every bash block in the docs either runs here or is tagged manual, and every Mermaid diagram
      # parses. No credentials are configured for this job on purpose: that is the whole assertion.
      - run: uv run python scripts/verify_docs.py

  secrets:
    runs-on: ubuntu-latest
    steps:
      # Full history: gitleaks scans every commit, and a secret removed in the tip commit is still
      # a secret. Shallow clones silently reduce that to one commit.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No GITLEAKS_LICENSE: the action is free for public repositories. The job summary is the
          # one feature that calls the licensing API, so it stays off.
          GITLEAKS_ENABLE_SUMMARY: false

  # The promise the README makes -- clone it and it runs -- tested the only way it can be: from a
  # clone, not from the checkout, so a file that exists only on somebody's laptop fails here.
  fresh-clone:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install "3.12"
      - name: clone the checkout and run the suite from the clone
        run: |
          # actions/checkout leaves a detached HEAD on a pull_request, and `git clone` of a repo whose
          # HEAD points at no branch has nothing to check out. Name the commit first.
          git -C "$GITHUB_WORKSPACE" branch -f fresh-clone-src HEAD
          git clone --depth 1 --branch fresh-clone-src "$GITHUB_WORKSPACE" /tmp/fresh
          cd /tmp/fresh
          uv sync --frozen --python "3.12"
          uv run pytest -q
          uv run python doctor.py --help

  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v4
      - run: docker buildx build --platform linux/arm64 -f app/ops_investigator/Dockerfile app/ops_investigator
      - run: docker buildx build --platform linux/arm64 -f app/ops_investigator/Dockerfile.a2a app/ops_investigator
