[project]
name = "strands-harness-on-aws"
version = "0.1.0"
description = "Strands harness on Amazon Bedrock AgentCore, the production way"
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.6",
  "boto3>=1.43",
  "httpx>=0.28",
  "ops-investigator",
]

[tool.uv.workspace]
members = ["app/ops_investigator"]

[tool.uv.sources]
ops-investigator = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # repo root, so tests/test_doctor.py can `import doctor` (standalone script at the repo root)
asyncio_mode = "auto"
markers = ["live: needs AWS credentials and network; skipped by default"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["docs"]
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
